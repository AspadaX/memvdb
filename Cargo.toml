[package]
name = "memvdb"
version = "0.1.1"
edition = "2024"
authors = ["Xinyu Bao <baoxinyuworks@163.com>"]
description = "A Rust in-memory vector database"
license = "MIT"
repository = "https://github.com/AspadaX/memvdb"
readme = "README.md"
keywords = ["vector", "database", "in-memory", "search", "embedding"]
categories = ["database", "data-structures"]

[features]
default = ["log", "serde", "persist", "rayon"]
log = ["dep:log"]
serde = ["dep:serde"]
persist = ["dep:serde_json", "serde"]
rayon = ["dep:rayon"]

[dependencies]
anyhow = "1.0.98"
thiserror = "2.0.12"
rayon = { version = "1.10.0", optional = true}
log = { version = "0.4.27", optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }

[[example]]
name = "basic_usage"
doc-scrape-examples = true

[[example]]
name = "document_similarity"
doc-scrape-examples = true

[[example]]
name = "distance_metrics"
doc-scrape-examples = true

[[example]]
name = "batch_operations"
doc-scrape-examples = true
